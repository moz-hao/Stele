<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>网易支付</title>
    <link
      rel="shortcut icon"
      href="https://i.epay.126.net/a/eyq/old/favicon.ico"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        font: 12px/22px sans-serif;
      }

      .head {
        position: relative;
        margin: 0 auto;
        width: 1000px;
        height: 80px;
      }

      .head__logo {
        display: block;
        width: 170px;
        height: 66px;
        background: url(https://i.epay.126.net/a/eyq/images/logo-2015.png)
          center bottom no-repeat;
      }

      .head__menus {
        position: absolute;
        top: 0;
        right: 270px;
        line-height: 76px;
      }

      .head__menus a {
        display: inline-block;
        margin-left: 62px;
        font-size: 18px;
        text-decoration: none;
        color: #374660;
        border-bottom: 4px solid #fff;
      }

      .head__menus a.active,
      .head__menus a:hover {
        color: #bc4728;
        border-color: #bc4728;
      }

      .body {
        height: 570px;
        background: url(https://epay.nosdn.127.net/83a85fe9-0aaf-401c-9a59-cd8577b838b2.jpg)
          no-repeat center center;
      }

      .foot {
        margin-top: 50px;
        text-align: center;
        color: #50545f;
      }

      .foot a {
        color: #50545f;
      }
    </style>
  </head>
  <body>
    <div class="head">
      <a href="https://epay.163.com/" class="head__logo"></a>
      <div class="head__menus">
        <a href="https://epay.163.com/" class="active">首页</a>
        <a href="https://platform.epay.163.com/">商户入口</a>
      </div>
    </div>
    <div class="body"></div>
    <div class="foot">
      <p>
        <a href="http://beian.miit.gov.cn/"
          >工业和信息化部备案系统网站 备案编号：浙B2-20100458</a
        >
      </p>
      <p>网易支付（杭州）有限公司版权所有 &copy;1997-2025</p>
    </div>
  </body>
</html>
